[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[project]
name = "list-coding-agents"
version = "0.1.0"
description = "Browse and resume local coding-agent sessions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HACKE-RC" }]
keywords = ["claude-code", "codex", "cli", "sessions", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.scripts]
lc = "lc.cli:main"

[project.urls]
Homepage = "https://github.com/HACKE-RC/lc"
Issues = "https://github.com/HACKE-RC/lc/issues"

[tool.uv.build-backend]
module-name = "lc"
